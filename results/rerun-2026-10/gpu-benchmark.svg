<title id="t">Time to estimate pi against number of samples, log-log</title>
<desc id="d">Median across 10 sweeps (4 at 1B) of 20 timed runs per size on an NVIDIA GeForce RTX 4060 and an AMD Ryzen 9 5950X under WSL2. The GPU overtakes one CPU thread between 10,000 and 100,000 samples.</desc>
